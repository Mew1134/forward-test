name: forward-test

on:
  schedule:
    # 21:30 UTC จันทร์-ศุกร์ = 04:30 น. เวลาไทย (หลังตลาดสหรัฐปิด)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run forward test
        run: python3 forward_test.py
      - name: Save results
        run: |
          git config user.name "forward-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results.csv state.json SUMMARY.md
          git diff --cached --quiet || git commit -m "forward test $(date -u +%F)"
          git push
